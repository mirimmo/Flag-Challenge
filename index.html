<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><title>Flag Challenge</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#243750,#101827 65%);color:#f8fafc;font:17px system-ui;min-height:100dvh}main{max-width:680px;margin:auto;padding:24px}h1{text-align:center;font-size:clamp(28px,6vw,48px);margin:12px 0}p{color:#b7c5d8}label{display:block;margin:20px 0 8px}input,select,button{font:inherit;border:1px solid #475569;border-radius:12px;padding:12px;background:#1e293b;color:white}input{min-width:0;flex:1}button{cursor:pointer}select{width:100%}.person{display:flex;gap:8px;margin:8px 0}.primary{background:#087e68;width:100%;margin-top:20px;font-weight:bold}.notice{color:#fbbf24;font-size:14px}#game{text-align:center;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 12px 65px}#flag{width:min(86vw,520px);height:min(36dvh,310px);object-fit:contain;filter:drop-shadow(0 12px 22px #0007)}#dial{width:130px;height:130px}#ring{transition:stroke .3s;stroke-linecap:round}#hint{font-size:clamp(23px,5vw,36px);font-weight:650;min-height:0}#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(95%,520px)}#choices div{background:#263449;border:1px solid #40516a;border-radius:12px;padding:10px;font-size:clamp(15px,3.8vw,22px)}#over{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#351f2b;color:#fda4af;font-size:14px} [hidden]{display:none!important}.rank{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid #475569}.confetti{position:fixed;top:-20px;width:9px;height:15px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

body{background:radial-gradient(ellipse at 15% 0%,#263d71,transparent 55%),radial-gradient(ellipse at 90% 85%,#213e4e,transparent 55%),#080f20}main{max-width:620px}#setup,#results{margin:24px auto;padding:28px;border:1px solid #ffffff25;border-radius:28px;background:#111b30d9;box-shadow:0 24px 80px #0005}h1{letter-spacing:-1.5px}input,select,button{border-radius:16px;background:linear-gradient(145deg,#293b58,#18243a);border:1px solid #ffffff25;box-shadow:0 5px 14px #0002}button:hover{filter:brightness(1.2)}.primary{background:linear-gradient(110deg,#16b99b,#3478e8);border:0;padding:17px;box-shadow:0 8px 30px #16b99b44}#flag{filter:drop-shadow(0 18px 30px #0008);animation:float 3s ease-in-out infinite}#flag.arrive{animation:arrive .55s ease-out,float 3s .55s ease-in-out infinite}@keyframes arrive{from{opacity:0;transform:scale(.85) rotate(-3deg)}to{opacity:1;transform:scale(1)}}@keyframes float{50%{transform:translateY(-5px) rotate(.6deg)}}#dial{filter:drop-shadow(0 0 14px #54d6bc55)}#choices div{background:linear-gradient(135deg,#354a77,#18283f);border:1px solid #8da7e44d;border-radius:18px;padding:15px 8px;box-shadow:0 8px 20px #0004;animation:arrive .35s ease-out}#hint{color:#f8d68b;text-shadow:0 0 20px #e6b45455}#over{border-radius:30px;padding:9px 22px}@media(prefers-reduced-motion:reduce){#flag,#flag.arrive,#choices div{animation:none}}@media(max-width:650px){#setup,#results{margin:12px;padding:20px}}
</style></head><body><main id="setup"><h1>🏆 Flag Challenge</h1><p style="text-align:center">Family Edition · Persian voice host</p><label>Participants</label><div id="people"></div><button id="add">+ Add participant</button><button id="ask">Ask for names by voice</button><label for="mode">Difficulty</label><select id="mode"><option value="p1">Progressive 1 — Easy → Medium → Hard</option><option value="p2">Progressive 2 — Medium → Hard</option><option value="hard">Hard only</option></select><label for="recognition">Answer recognition</label><select id="recognition"><option value="mixed">Persian + English (experimental)</option><option value="fa-IR">Persian recognition</option><option value="en-US">English recognition</option></select><p>15 flags per participant · 10 seconds per attempt</p><div id="notice" class="notice" role="status"></div><button id="start" class="primary">Start Game</button></main><section id="game" hidden><img id="flag" alt="Country flag"><div id="hint"></div><div id="choices"></div><svg id="dial" viewBox="0 0 120 120" aria-label="Countdown"><circle cx="60" cy="60" r="51" fill="none" stroke="#334155" stroke-width="8"/><circle id="ring" cx="60" cy="60" r="51" fill="none" stroke="#52e5a5" stroke-width="8" transform="rotate(-90 60 60)"/><text id="seconds" x="60" y="73" text-anchor="middle" fill="white" font-size="38" font-weight="600">10</text></svg><button id="over">Game Over</button></section><main id="results" hidden><h1>Final Results</h1><div id="ranking"></div><button id="again" class="primary">Play Again</button></main><script src="data.js"></script><script src="audio.js?v=4"></script><script src="game.js?v=4"></script></body></html>
